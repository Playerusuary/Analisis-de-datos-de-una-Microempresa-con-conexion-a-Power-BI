<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <link rel="stylesheet" href="../paginas.css"/>
  <link rel="stylesheet" href="Inicio.css"/>
</head>
<body>

  <div class="dash-header">
    <p class="sec-label">Resumen del día anterior</p>
    <span class="fecha-ayer" id="fechaAyer"></span>
  </div>

  <!-- KPIs -->
  <div class="kpi-row">
    <div class="kpi g">
      <div class="kpi-val" id="kpiVentas">—</div>
      <div class="kpi-lbl">Ventas totales</div>
    </div>
    <div class="kpi r">
      <div class="kpi-val" id="kpiStockBajo">—</div>
      <div class="kpi-lbl">Productos stock bajo</div>
    </div>
    <div class="kpi w">
      <div class="kpi-val" id="kpiCumplidas">—</div>
      <div class="kpi-lbl">Ventas cumplidas</div>
    </div>
  </div>

  <!-- Fila inferior -->
  <div class="row2">

    <!-- Stock bajo y crítico -->
    <div class="card">
      <div class="card-tit">Stock bajo y crítico</div>
      <div id="listaStock">
        <div class="cargando">Cargando...</div>
      </div>
    </div>

    <!-- Productos vendidos ayer -->
    <div class="card">
      <div class="card-tit">Productos vendidos ayer</div>
      <table class="tbl">
        <thead>
          <tr>
            <th>Producto</th>
            <th>Uds.</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="tablaProductos"></tbody>
      </table>
    </div>

  </div>

  <script src="Inicio.js"></script>
</body>
</html>
