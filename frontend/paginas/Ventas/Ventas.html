<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ventas</title>
  <link rel="stylesheet" href="../paginas.css"/>
  <link rel="stylesheet" href="Ventas.css"/>
</head>
<body>

  <div class="dash-header">
    <p class="sec-label">Ventas del día anterior</p>
    <span class="fecha-ayer" id="fechaAyer"></span>
  </div>

  <div class="resumen">
    <div class="res-card g">
      <div class="res-val" id="resVentas">—</div>
      <div class="res-lbl">Total vendido</div>
    </div>
    <div class="res-card b">
      <div class="res-val" id="resEfectivo">—</div>
      <div class="res-lbl">Efectivo</div>
    </div>
    <div class="res-card w">
      <div class="res-val" id="resTarjeta">—</div>
      <div class="res-lbl">Tarjeta</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="buscar">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
           viewBox="0 0 24 24" fill="none" stroke="#7A6050"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="inputBuscar" placeholder="Buscar producto..."/>
    </div>
    <select class="filtro" id="filtroMetodo">
      <option value="">Todos los métodos</option>
      <option value="Efectivo">Efectivo</option>
      <option value="Tarjeta">Tarjeta</option>
    </select>
  </div>

  <div class="card">
    <table class="tbl">
      <thead>
        <tr>
          <th>#</th>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Precio unit.</th>
          <th>Total</th>
          <th>Método de pago</th>
          <th>Hora</th>
        </tr>
      </thead>
      <tbody id="tablaVentas"></tbody>
    </table>
  </div>

  <script src="Ventas.js"></script>
</body>
</html>
